<svg
  width="56"
  height="56"
  viewBox="0 0 56 56"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Icon background -->
  <rect
    x="4"
    y="4"
    width="48"
    height="48"
    rx="14"
    fill="#020617"
  />

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="financeGradient" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Gradient frame -->
  <rect
