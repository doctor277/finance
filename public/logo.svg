  <!-- Candles/bars -->
  <rect x="16" y="30" width="4" height="12" rx="1.5" fill="#22C55E"/>
  <rect x="24" y="24" width="4" height="18" rx="1.5" fill="#4ADE80"/>
  <rect x="32" y="20" width="4" height="22" rx="1.5" fill="#86EFAC"/>

  <!-- Trend arrow -->
  <path
    d="M18 26L27 19.5L32 22.5L39.5 15"
    stroke="#38BDF8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
